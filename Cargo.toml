[package]
name = "cargo-env-run"
version = "0.4.0"
edition = "2024"
description = "Like dotenv but with `.cargo/config.toml` files"
repository = "https://github.com/qtfkwk/cargo-env-run"
license = "MIT"

[dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.46", features = ["derive", "wrap_help"] }
clap-cargo = "0.17.0"
directories = "6.0.0"
indexmap = { version = "2.11.0", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
toml = { version = "0.9.5", features = ["parse"] }
